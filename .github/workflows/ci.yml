name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (VMCore)
        run: swift test --package-path VMCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project PocketVM.xcodeproj \
            -scheme PocketVM \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
