<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PocketVM PC</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #ddd;
    font: 13px -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
  }
  #screen_container { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #screen_container > div { white-space: pre; font: 16px monospace; line-height: 16px; color: #fff; }
  #screen_container canvas { display: block; image-rendering: pixelated; }
  #touch { position: absolute; inset: 0; z-index: 5; }
  #keyboard_button {
    position: absolute; right: 12px; bottom: 12px; z-index: 10;
    width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: rgba(80, 80, 80, 0.55); color: #fff; font-size: 22px;
  }
  .phone_keyboard {
    position: absolute; left: 0; top: 0; width: 1px; height: 1px;
    opacity: 0; border: 0; padding: 0; resize: none; z-index: 1;
    font-size: 16px; /* avoids zoom on focus */
  }
  #message {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    z-index: 8; padding: 10px 16px; border-radius: 10px;
    background: rgba(40, 40, 40, 0.85); display: none; text-align: center;
  }
</style>
</head>
<body>
  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>
  <div id="touch"></div>
  <textarea class="phone_keyboard" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <button id="keyboard_button" aria-label="Keyboard">⌨︎</button>
  <div id="message"></div>
  <script src="libv86.js"></script>
  <script src="pvm-disk.js"></script>
  <script src="pvm.js"></script>
</body>
</html>
